[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plataformas-ofertas"
version = "0.1.0"
description = "Backend para coleta e distribuição de ofertas de marketplaces"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "psycopg[binary]",
    "alembic",
    "pydantic-settings",
]

[tool.setuptools.packages.find]
where = ["src"]